; Surcharge de la configuration PHP sur Vercel (ajoutée au php.ini du runtime).
; Ce fichier est retiré automatiquement du déploiement pendant le build.

; Ne jamais afficher les erreurs PHP aux visiteurs : elles partent dans les logs Vercel.
display_errors = Off
log_errors = On

; Cookie de session (Vercel sert toujours en HTTPS)
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_only_cookies = 1
